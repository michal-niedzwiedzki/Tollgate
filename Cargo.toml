[workspace]
resolver = "2"
members = [
    "crates/tollgate-core",
    "crates/tollgate-gateway",
    "crates/tollgate-settler",
]

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
axum = "0.8"
tower = "0.5"
hyper = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
redis = { version = "1.5", features = ["tokio-comp", "connection-manager"] }
alloy = { version = "2.1", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "2.0"
base64 = "0.22"
